<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Takenlijst met akkoord en afwijs functie" />
  <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#a78bfa" media="(prefers-color-scheme: light)" />

  <title>Takenbeheer</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Taken" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-content">
      <div>
        <h1 id="app-titel">Taken</h1>
        <p>Taken bekijken, goedkeuren of afwijzen</p>
      </div>
    
    </div>
  </header>
  <button id="btn-vernieuwen" class="btn btn-vernieuwen" type="button" aria-label="Vernieuwen">↻</button>

  <main>
    <!-- Search field -->
    <input id="taak-zoek" class="zoekveld" type="search" placeholder="Zoek op titel…" aria-label="Zoek in takenlijst" autocomplete="off" />

    <!-- Filter tabs -->
    <nav class="filter-tabs" aria-label="Filter op status">
      <button class="filter-btn active" type="button" data-filter="alle">Alle</button>
      <button class="filter-btn" type="button" data-filter="wacht_op_akkoord">Wacht op akkoord</button>
      <button class="filter-btn" type="button" data-filter="bezig">Bezig</button>
      <button class="filter-btn" type="button" data-filter="klaar">Klaar</button>
      <button class="filter-btn" type="button" data-filter="mislukt">Mislukt</button>
    </nav>

    <!-- Secondary filters: owner filter and archived toggle in one small menu -->
    <div class="filter-extra">
      <button id="btn-filtermenu" class="btn btn-filtermenu" type="button" aria-expanded="false" aria-controls="filter-menu">Meer filters ▾</button>
      <div id="filter-menu" class="filter-menu" hidden>
        <nav class="eigenaar-filter" aria-label="Filter op eigenaar">
          <button class="eigenaar-filter-btn active" type="button" data-eigenaarfilter="alle">Alle taken</button>
          <button class="eigenaar-filter-btn" type="button" data-eigenaarfilter="eigen">Door jou aangemaakt</button>
        </nav>
        <button id="btn-toon-gearchiveerd" class="btn btn-toon-gearchiveerd" type="button" aria-pressed="false">Toon gearchiveerd</button>
      </div>
    </div>

    <!-- Wacht op akkoord teller -->
    <div id="wacht-akkoord-teller" class="wacht-akkoord-teller" hidden></div>

    <!-- Task list, populated by app.js -->
    <ul id="taak-lijst" aria-live="polite" aria-label="Takenlijst">
      <li class="status-msg">Laden…</li>
    </ul>
  </main>

  <!-- Toasts for outcomes -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Bottom sheet: reject with reason -->
  <div id="afwijs-sheet" class="sheet" hidden>
    <div id="afwijs-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-paneel" role="dialog" aria-modal="true" aria-labelledby="afwijs-titel">
      <h2 id="afwijs-titel" class="sheet-titel">Taak afwijzen</h2>
      <p id="afwijs-taak" class="sheet-taak"></p>
      <label for="afwijs-reden" class="sheet-label">Reden (optioneel)</label>
      <textarea id="afwijs-reden" class="sheet-reden" rows="3" maxlength="500" placeholder="Waarom wijs je dit af?"></textarea>
      <div class="sheet-acties">
        <button id="afwijs-annuleer" class="btn btn-details" type="button">Annuleren</button>
        <button id="afwijs-bevestig" class="btn btn-afwijs-bevestig" type="button">Afwijzen</button>
      </div>
    </div>
  </div>

  <div id="annuleer-sheet" class="sheet" hidden>
    <div id="annuleer-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-paneel" role="alertdialog" aria-modal="true" aria-labelledby="annuleer-titel" aria-describedby="annuleer-tekst">
      <h2 id="annuleer-titel" class="sheet-titel">Taak annuleren?</h2>
      <p id="annuleer-tekst" class="sheet-taak"></p>
      <div class="sheet-acties">
        <button id="annuleer-terug" class="btn btn-details" type="button">Terug</button>
        <button id="annuleer-bevestig" class="btn btn-afwijs-bevestig" type="button">Annuleer taak</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
