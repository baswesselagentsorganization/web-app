<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Takenlijst met akkoord en afwijs functie" />
  <meta name="theme-color" content="#4a90d9" />

  <title>Takenbeheer</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Taken" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-content">
      <div>
        <h1 id="app-titel">Taken</h1>
        <p>Taken bekijken, goedkeuren of afwijzen</p>
      </div>
      <button id="btn-vernieuwen" class="btn btn-vernieuwen" type="button" aria-label="Vernieuwen">↻</button>
    </div>
  </header>

  <main>
    <!-- Search field -->
    <input id="taak-zoek" class="zoekveld" type="search" placeholder="Zoek op titel…" aria-label="Zoek in takenlijst" autocomplete="off" />

    <!-- Filter tabs -->
    <nav class="filter-tabs" aria-label="Filter op status">
      <button class="filter-btn active" type="button" data-filter="alle">Alle</button>
      <button class="filter-btn" type="button" data-filter="wacht_op_akkoord">Wacht op akkoord</button>
      <button class="filter-btn" type="button" data-filter="bezig">Bezig</button>
      <button class="filter-btn" type="button" data-filter="klaar">Klaar</button>
      <button class="filter-btn" type="button" data-filter="mislukt">Mislukt</button>
    </nav>

    <!-- Wacht op akkoord teller -->
    <div id="wacht-akkoord-teller" class="wacht-akkoord-teller" style="display: none;"></div>

    <!-- Task list, populated by app.js -->
    <ul id="taak-lijst" aria-live="polite" aria-label="Takenlijst">
      <li class="status-msg">Laden…</li>
    </ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
